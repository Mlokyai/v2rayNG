name: Build Mloky APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and Build libhevtun
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018
          chmod +x ./compile-hevtun.sh
          ./compile-hevtun.sh

      - name: Download libv2ray
        run: |
          mkdir -p V2rayNG/app/libs
          LATEST_URL=$(curl -s https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest | grep "browser_download_url.*\.aar" | head -n 1 | cut -d '"' -f 4)
          wget -O V2rayNG/app/libs/libv2ray.aar "$LATEST_URL"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Debug APK
        working-directory: ./V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.newDsl=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mloky-v2rayNG-Shizzi-APK
          path: V2rayNG/app/build/outputs/apk/debug/*.apk
