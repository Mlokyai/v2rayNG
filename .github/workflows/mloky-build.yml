name: Build v2rayNG Shizzi APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r30 / Latest and compile hevtun
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018
          if [ -f "./compile-hevtun.sh" ]; then
            chmod +x ./compile-hevtun.sh
            ./compile-hevtun.sh || true
          fi

      - name: Download libv2ray.aar
        run: |
          mkdir -p V2rayNG/app/libs
          LATEST_URL=$(curl -s https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest | grep "browser_download_url.*\.aar" | head -n 1 | cut -d '"' -f 4)
          wget -O V2rayNG/app/libs/libv2ray.aar "$LATEST_URL"

      - name: Build Debug APK
        working-directory: ./V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mloky-v2rayNG-Shizzi-APK
          path: V2rayNG/app/build/outputs/apk/**/*.apk
