name: Build APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Build libhevtun
        run: |
          chmod +x ./compile-hevtun.sh
          ./compile-hevtun.sh

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.11
        with:
          repository: "2dust/AndroidLibXrayLite"
          latest: true
          fileName: "libv2ray.aar"
          out-file-path: "V2rayNG/app/libs"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Debug APK
        working-directory: ./V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mloky-v2rayNG-Shizzi-APK
          path: V2rayNG/app/build/outputs/apk/debug/*.apk
